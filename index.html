<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOP V</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  :root{
    --crimson:#A51C30; --crimson-dark:#7a1524; --gold:#C9A85C;
    --bg:#f6f2ea; --card:#ffffff; --ink:#1f1a17; --sub:#6b615a;
    --border:#e3dccf; --danger:#a51c30;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'EB Garamond',Georgia,serif;display:flex;flex-direction:column;}
  header{background:var(--crimson);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);flex-shrink:0;}
  .crest{width:34px;height:34px;flex-shrink:0;}
  header h1{font-family:'Playfair Display',serif;font-size:22px;margin:0;letter-spacing:.5px;}
  header .tag{font-size:12px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}
  header .spacer{flex:1;}
  header .who{font-size:14px;opacity:.9;margin-right:10px;}
  .btn{cursor:pointer;border:1px solid transparent;border-radius:6px;padding:8px 16px;font-family:inherit;font-size:15px;transition:.15s;}
  .btn-outline{background:transparent;border-color:rgba(255,255,255,.6);color:#fff;}
  .btn-outline:hover{background:rgba(255,255,255,.12);}
  .btn-primary{background:var(--crimson);color:#fff;}
  .btn-primary:hover{background:var(--crimson-dark);}
  main{flex:1;display:flex;overflow:hidden;min-height:0;}
  #auth{flex:1;display:flex;align-items:center;justify-content:center;padding:30px 16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.08);max-width:380px;width:100%;padding:30px;text-align:center;}
  .card .crest{width:52px;height:52px;margin:0 auto 10px;display:block;}
  .card h2{font-family:'Playfair Display',serif;margin:0 0 4px;font-size:24px;}
  .card p.sub{color:var(--sub);font-size:14px;margin:0 0 22px;}
  .tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{flex:1;padding:10px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;font-size:15px;}
  .tab.active{color:var(--crimson);border-color:var(--crimson);font-weight:600;}
  .field{margin-bottom:14px;text-align:left;}
  .field label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:5px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;}
  .field input:focus{outline:none;border-color:var(--crimson);}
  .full{width:100%;margin-top:6px;}
  .msg-err{color:var(--danger);font-size:13px;margin-top:10px;min-height:16px;}
  .msg-info{color:var(--sub);font-size:12px;margin-top:14px;line-height:1.5;}
  #chat{display:none;flex:1;overflow:hidden;width:100%;min-height:0;}
  #chat.show{display:flex;}
  aside{width:220px;flex-shrink:0;background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;transition:transform .25s ease;}
  aside h3{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--sub);margin:0;}
  .aside-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  #asideClose{display:none;cursor:pointer;font-size:22px;line-height:1;color:var(--sub);}
  #teamToggle{display:none;}
  .member{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:15px;border-bottom:1px solid var(--border);}
  .member .crown{color:var(--gold);}
  .member .del{margin-left:auto;color:var(--danger);cursor:pointer;font-size:13px;opacity:.7;}
  .member .del:hover{opacity:1;}
  .chatarea{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;}
  #messages{flex:1;overflow-y:auto;padding:20px;min-height:0;}
  .bubble{max-width:70%;margin-bottom:14px;padding:10px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--border);}
  .bubble.me{margin-left:auto;background:var(--crimson);color:#fff;border-color:var(--crimson);}
  .bubble .name{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--sub);margin-bottom:3px;}
  .bubble.me .name{color:#f2d9de;}
  .bubble .txt{font-size:16px;line-height:1.4;word-wrap:break-word;}
  form#sendForm{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--card);flex-shrink:0;}
  form#sendForm input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:16px;}
  form#sendForm input:focus{outline:none;border-color:var(--crimson);}
  form#sendForm button{flex-shrink:0;white-space:nowrap;}
  .empty{color:var(--sub);text-align:center;margin-top:40px;font-style:italic;}
  #poweredBy{flex-shrink:0;text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--sub);padding:8px 0;background:var(--card);border-top:1px solid var(--border);}
  #poweredBy span{color:var(--crimson);font-weight:600;}
  @media (max-width:640px){
    #teamToggle{display:inline-block;}
    #asideClose{display:inline-block;}
    aside{position:fixed;top:0;left:0;height:100%;width:78vw;max-width:260px;z-index:60;transform:translateX(-100%);box-shadow:2px 0 20px rgba(0,0,0,.3);}
    aside.open{transform:translateX(0);}
    .bubble{max-width:85%;}
  }
  #asideBackdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;}
  #asideBackdrop.show{display:block;}
</style>
</head>
<body>

<header>
  <svg class="crest" viewBox="0 0 48 48"><path d="M24 3 L44 12 V24 C44 36 35 44 24 45 C13 44 4 36 4 24 V12 Z" fill="#7a1524" stroke="#C9A85C" stroke-width="2"/><text x="24" y="30" font-family="Playfair Display, serif" font-size="18" fill="#C9A85C" text-anchor="middle" font-weight="700">V</text></svg>
  <div><h1>TOP V</h1><div class="tag">Private Team</div></div>
  <div class="spacer"></div>
  <button class="btn btn-outline" id="teamToggle">☰ Team</button>
  <span class="who" id="whoLabel"></span>
  <button class="btn btn-outline" id="logoutBtn" style="display:none;">Sign Out</button>
</header>

<main>
  <div id="auth">
    <div class="card">
      <svg class="crest" viewBox="0 0 48 48"><path d="M24 3 L44 12 V24 C44 36 35 44 24 45 C13 44 4 36 4 24 V12 Z" fill="#A51C30" stroke="#C9A85C" stroke-width="2"/><text x="24" y="30" font-family="Playfair Display, serif" font-size="18" fill="#C9A85C" text-anchor="middle" font-weight="700">V</text></svg>
      <h2>TOP V</h2>
      <p class="sub">A private space for your team of five</p>
      <div class="tabs">
        <div class="tab active" data-tab="login">Sign In</div>
        <div class="tab" data-tab="register">Register</div>
      </div>
      <div id="loginPane">
        <div class="field"><label>Username</label><input id="loginUser" autocomplete="username"></div>
        <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
        <button class="btn btn-primary full" id="loginBtn">Sign In</button>
      </div>
      <div id="registerPane" style="display:none;">
        <div class="field"><label>Choose a username</label><input id="regUser" autocomplete="username"></div>
        <div class="field"><label>Choose a password</label><input id="regPass" type="password" autocomplete="new-password"></div>
        <button class="btn btn-primary full" id="regBtn">Create Account</button>
        <p class="msg-info">Limited to 5 teammates. The first person to register becomes the team admin.</p>
      </div>
      <div class="msg-err" id="authErr"></div>
    </div>
  </div>

  <div id="chat">
    <aside id="teamAside">
      <div class="aside-head"><h3>Team</h3><span id="asideClose">&times;</span></div>
      <div id="memberList"></div>
    </aside>
    <div id="asideBackdrop"></div>
    <div class="chatarea">
      <div id="messages"><div class="empty">No messages yet — say hello.</div></div>
      <form id="sendForm">
        <input id="msgInput" placeholder="Write a message…" autocomplete="off">
        <button class="btn btn-primary" type="submit">Send</button>
      </form>
    </div>
  </div>
</main>
<footer id="poweredBy">Powered by <span>Vex</span></footer>

<!-- Firebase (free) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* =====================================================================
   1) Go to https://console.firebase.google.com -> Create a project.
   2) Build -> Firestore Database -> Create database -> Start in TEST MODE.
   3) Project settings (gear icon) -> General -> "Your apps" -> Web (</>) ->
      register an app -> copy the firebaseConfig object it gives you and
      paste it below, replacing the placeholder.
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDqpxJdkGO75kefy1rN8zE34Fsm98iEMcQ",
  authDomain: "top-v-9abfb.firebaseapp.com",
  projectId: "top-v-9abfb",
  storageBucket: "top-v-9abfb.firebasestorage.app",
  messagingSenderId: "436986529374",
  appId: "1:436986529374:web:2de8b9d0e190137fd916cf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null, unsubMsg = null, unsubUsers = null, allUsers = [];

function sanitize(s){ return (s||'').trim().toLowerCase().replace(/[^a-z0-9_\-]/g,'').slice(0,20); }
function setErr(t){ document.getElementById('authErr').textContent = t || ''; }

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); setErr('');
  document.getElementById('loginPane').style.display = t.dataset.tab==='login' ? '' : 'none';
  document.getElementById('registerPane').style.display = t.dataset.tab==='register' ? '' : 'none';
}));

(async function init(){
  const saved = localStorage.getItem('topv_user');
  if(saved){
    try{
      const snap = await db.collection('users').doc(saved).get();
      if(snap.exists){ currentUser = {username: saved, ...snap.data()}; enterChat(); return; }
    }catch(e){}
    localStorage.removeItem('topv_user');
  }
})();

document.getElementById('regBtn').addEventListener('click', async ()=>{
  setErr('');
  const username = sanitize(document.getElementById('regUser').value);
  const password = document.getElementById('regPass').value;
  if(!username || username.length<3) return setErr('Choose a username of at least 3 characters (letters/numbers).');
  if(!password) return setErr('Please choose a password.');
  try{
    const usersSnap = await db.collection('users').get();
    if(usersSnap.size >= 5) return setErr('TOP V has reached its limit of 5 members.');
    const ref = db.collection('users').doc(username);
    const existing = await ref.get();
    if(existing.exists) return setErr('That username is already taken.');
    const isAdmin = usersSnap.size === 0;
    await ref.set({password, isAdmin, createdAt: Date.now()});
    localStorage.setItem('topv_user', username);
    currentUser = {username, password, isAdmin};
    enterChat();
  }catch(e){ setErr('Could not reach the database. Check your Firebase config and rules.'); }
});

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  setErr('');
  const username = sanitize(document.getElementById('loginUser').value);
  const password = document.getElementById('loginPass').value;
  if(!username || !password) return setErr('Enter your username and password.');
  try{
    const snap = await db.collection('users').doc(username).get();
    if(!snap.exists) return setErr('No such member.');
    const data = snap.data();
    if(data.password !== password) return setErr('Incorrect password.');
    localStorage.setItem('topv_user', username);
    currentUser = {username, ...data};
    enterChat();
  }catch(e){ setErr('Could not reach the database. Check your Firebase config and rules.'); }
});

function enterChat(){
  document.getElementById('auth').style.display = 'none';
  document.getElementById('chat').classList.add('show');
  document.getElementById('whoLabel').textContent = currentUser.username + (currentUser.isAdmin ? ' (Admin)' : '');
  document.getElementById('logoutBtn').style.display = '';
  subscribeMembers();
  subscribeMessages();
}

document.getElementById('logoutBtn').addEventListener('click', ()=>{
  if(unsubMsg) unsubMsg();
  if(unsubUsers) unsubUsers();
  localStorage.removeItem('topv_user');
  currentUser = null;
  document.getElementById('chat').classList.remove('show');
  document.getElementById('auth').style.display = '';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('whoLabel').textContent = '';
});

function closeAside(){
  document.getElementById('teamAside').classList.remove('open');
  document.getElementById('asideBackdrop').classList.remove('show');
}
document.getElementById('teamToggle').addEventListener('click', ()=>{
  document.getElementById('teamAside').classList.toggle('open');
  document.getElementById('asideBackdrop').classList.toggle('show');
});
document.getElementById('asideClose').addEventListener('click', closeAside);
document.getElementById('asideBackdrop').addEventListener('click', closeAside);

function subscribeMembers(){
  unsubUsers = db.collection('users').onSnapshot(snap=>{
    allUsers = snap.docs.map(d=>({username:d.id, ...d.data()}));
    const el = document.getElementById('memberList');
    el.innerHTML = allUsers.map(u=>{
      const canDelete = currentUser.isAdmin && u.username !== currentUser.username;
      return `<div class="member"><span>${u.isAdmin?'<span class="crown">&#9733; </span>':''}${escapeHtml(u.username)}</span>${canDelete?`<span class="del" data-u="${escapeHtml(u.username)}">remove</span>`:''}</div>`;
    }).join('');
    el.querySelectorAll('.del').forEach(btn=>btn.addEventListener('click', ()=>deleteMember(btn.dataset.u)));
  }, ()=>{});
}

async function deleteMember(username){
  if(!confirm('Remove '+username+' from the team?')) return;
  try{ await db.collection('users').doc(username).delete(); }catch(e){}
}

function subscribeMessages(){
  const q = db.collection('messages').orderBy('createdAt').limit(200);
  unsubMsg = q.onSnapshot(snap=>{
    const el = document.getElementById('messages');
    if(snap.empty){ el.innerHTML = '<div class="empty">No messages yet — say hello.</div>'; return; }
    el.innerHTML = snap.docs.map(d=>{
      const m = d.data();
      const mine = m.username === currentUser.username;
      return `<div class="bubble ${mine?'me':''}"><div class="name">${escapeHtml(m.username)}</div><div class="txt">${escapeHtml(m.text)}</div></div>`;
    }).join('');
    el.scrollTop = el.scrollHeight;
  }, ()=>{});
}

document.getElementById('sendForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text) return;
  input.value = '';
  try{ await db.collection('messages').add({username: currentUser.username, text, createdAt: Date.now()}); }
  catch(err){}
});

function escapeHtml(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
